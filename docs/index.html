<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unifying Reasoning and Planning through Energy Minimization</title>

    <!-- Open Graph Meta Tags -->
    <meta
      property="og:title"
      content="Unifying Reasoning and Planning through Energy Minimization"
    />
    <meta
      property="og:description"
      content="Unifying Reasoning and Planning through Energy Minimization — NeurIPS 2026"
    />
    <meta
      property="og:url"
      content="https://alexoarga.github.io/compositional_physics_simulation"
    />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"
    />

    <style>
      :root {
        --bg: #fafafa;
        --surface: #ffffff;
        --text-main: #111827;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --border: #e5e7eb;
        --pill-bg: #111827;
        --pill-bg-hover: #2563eb;
        --pill-text: #ffffff;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-pill: 9999px;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 4px 20px -2px rgba(17, 24, 39, 0.06);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
        background-size: 24px 24px;
        background-position: 0 0;
      }

      .page-backdrop {
        min-height: 100vh;
        background: linear-gradient(
          180deg,
          rgba(250, 250, 250, 0.65) 0%,
          rgba(250, 250, 250, 0.96) 320px,
          var(--bg) 100%
        );
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 1.5rem;
      }

      /* Hero / Header Section */
      .hero {
        padding: 5.5rem 0 3.5rem;
        text-align: center;
      }

      .venue-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.9rem;
        border-radius: var(--radius-pill);
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--text-main);
        margin-bottom: 1.5rem;
      }

      .venue-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
      }

      .paper-title {
        font-family: "Newsreader", Georgia, serif;
        font-size: clamp(2.1rem, 4.5vw, 3.25rem);
        font-weight: 500;
        line-height: 1.16;
        letter-spacing: -0.02em;
        color: var(--text-main);
        max-width: 820px;
        margin: 0 auto 1.75rem;
      }

      .authors-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem 2rem;
        font-size: 1.125rem;
        font-weight: 500;
        margin-bottom: 2.25rem;
      }

      .author-item a {
        color: var(--text-main);
        text-decoration: none;
        border-bottom: 1.5px solid transparent;
        transition: color 0.15s ease, border-color 0.15s ease;
      }

      .author-item a:hover {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }

      /* Action Buttons */
      .action-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.625rem 1.25rem;
        border-radius: var(--radius-pill);
        font-size: 0.925rem;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.18s ease;
        border: 1px solid transparent;
      }

      .btn-primary {
        background-color: var(--pill-bg);
        color: var(--pill-text);
        box-shadow: var(--shadow-sm);
      }

      .btn-primary:hover {
        background-color: var(--pill-bg-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px -4px rgba(37, 99, 235, 0.35);
      }

      .btn-secondary {
        background-color: var(--surface);
        color: var(--text-main);
        border-color: var(--border);
        box-shadow: var(--shadow-sm);
      }

      .btn-secondary:hover {
        border-color: #cbd5e1;
        background-color: #f8fafc;
        transform: translateY(-1px);
      }

      .btn i {
        font-size: 1.05rem;
      }

      /* Divider */
      .section-divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--border) 15%, var(--border) 85%, transparent);
        margin: 1rem 0 3rem;
      }

      @media (max-width: 640px) {
        .hero {
          padding: 3.5rem 0 2.5rem;
        }
        .authors-list {
          gap: 0.4rem 1.25rem;
          font-size: 1rem;
        }
        .btn {
          padding: 0.55rem 1.1rem;
          font-size: 0.875rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-backdrop">
      <main class="container">
        <header class="hero">
          <div class="venue-badge">
            <span class="venue-dot"></span>
            NeurIPS 2026
          </div>

          <h1 class="paper-title">
            Unifying Reasoning and Planning through Energy Minimization
          </h1>

          <div class="authors-list">
            <span class="author-item">
              <a href="#" target="_blank" rel="noopener noreferrer">
                Adrian Rodriguez
              </a>
            </span>
            <span class="author-item">
              <a href="#" target="_blank" rel="noopener noreferrer">
                Angelica Kim
              </a>
            </span>
            <span class="author-item">
              <a href="#" target="_blank" rel="noopener noreferrer">
                Yunhui Guo
              </a>
            </span>
            <span class="author-item">
              <a href="https://yilundu.github.io/" target="_blank" rel="noopener noreferrer">
                Yilun Du
              </a>
            </span>
          </div>

          <div class="action-links">
            <a class="btn btn-primary" href="#">
              <i class="ai ai-arxiv"></i>
              <span>arXiv</span>
            </a>
            <a class="btn btn-secondary" href="#">
              <i class="fa-regular fa-file-pdf"></i>
              <span>PDF</span>
            </a>
            <a class="btn btn-secondary" href="#">
              <i class="fa-brands fa-github"></i>
              <span>Code</span>
            </a>
          </div>
        </header>

        <div class="section-divider"></div>
      </main>
    </div>
  </body>
</html>
